services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    ports:
      - "8000:8000"
    environment:
      - TRADING_MODE=paper
      - INITIAL_BALANCE=10000
      - DATABASE_URL=sqlite+aiosqlite:///./warroom.db
      - API_HOST=0.0.0.0
      - API_PORT=8000
      - SCAN_INTERVAL_SECONDS=30
      - MIN_LIQUIDITY=5000
      - MIN_VOLUME_24H=1000
      - MAX_SPREAD=0.05
      - MIN_EV_THRESHOLD=0.02
      - MAX_POSITION_PCT=0.05
      - MAX_EXPOSURE_PCT=0.40
      - DAILY_LOSS_LIMIT_PCT=0.05
    volumes:
      - warroom-data:/app/data
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "3000:80"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  warroom-data:
